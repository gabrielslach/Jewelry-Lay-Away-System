openapi: 3.0.3
info:
  title: Mine Credit — Internal Storefront API
  description: |
    Draft contract for the storefront and admin panel against The Loft's own backend.
    Frontend never calls the inventory provider's API directly.

    **Auth:** `register`/`login` return `{ access_token, refresh_token, customer|admin }`.
    Use `Authorization: Bearer <access_token>`. Access tokens expire in 15 minutes;
    refresh with `POST .../refresh` using `{ refresh_token }` (valid 24 hours or until logout).

    **Rate limiting:** `register`/`login` (customer and admin) and customer refresh are
    limited to 10 attempts per 15 minutes per IP — `429 { error }` means too many attempts.

    **Dates:** report and list dates are ISO timestamps in UTC (a Manila midnight arrives as
    the previous day at 16:00Z) — display in Asia/Manila.
  version: "1.29"
  contact:
    name: The Loft IT Solutions
  x-status: draft contract for frontend build-against (Sep 23, 2026) — v1.29 (Oct 14, 2026)

servers:
  - url: https://honeydew-stork-999262.hostingersite.com
    description: Sandbox (will move before go-live)

# Default: no auth. Protected operations override with CustomerBearer / AdminBearer.
security: []

tags:
  - name: Gallery
  - name: Customers
  - name: Layaway
  - name: Bank Accounts
  - name: Admin Auth
  - name: Admin Staff
  - name: Admin Plans
  - name: Admin Customers
  - name: Admin Dashboard
  - name: Admin Settings
  - name: Admin Payments
  - name: Admin Alerts
  - name: Admin Reports
  - name: Admin Reservations
  - name: Finance

paths:
  /api/gallery:
    get:
      tags: [Gallery]
      summary: List browsable pieces
      description: |
        Paginated catalog via the backend adapter. `price` is always the peso price;
        `currency` is always `"PHP"`. Use `thumb_url` in grids, `web_url` on product pages,
        `url` only for zoom.
      operationId: listGallery
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated gallery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GalleryListResponse"

  /api/gallery/{id}:
    get:
      tags: [Gallery]
      summary: Single piece detail
      operationId: getGalleryItem
      parameters:
        - $ref: "#/components/parameters/GalleryId"
      responses:
        "200":
          description: Gallery item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GalleryItem"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/customers/register:
    post:
      tags: [Customers]
      summary: Customer registration
      operationId: registerCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerRegisterRequest"
      responses:
        "200":
          description: Registered; tokens issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerAuthResponse"
        "400":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/customers/login:
    post:
      tags: [Customers]
      summary: Customer login
      operationId: loginCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerAuthResponse"
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/customers/refresh:
    post:
      tags: [Customers]
      summary: Refresh customer access token
      description: No auth header. Exchange a still-valid refresh token for a new access_token.
      operationId: refreshCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"
        "401":
          description: Invalid, expired, or revoked refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Invalid, expired, or revoked refresh token
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/customers/forgot-password:
    post:
      tags: [Customers]
      summary: Request password reset email
      description: |
        Always returns 200 (never reveals whether the email is registered).
        If registered, customer gets a link to `<storefront>/reset-password?token=...`
        (one-time, expires in 1 hour). Rate limited like login.
      operationId: forgotPasswordCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Always success (email may or may not exist)
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/customers/reset-password:
    post:
      tags: [Customers]
      summary: Reset password with email token
      description: |
        Sets new password (min 8 chars), signs customer out of every device,
        emails a password-changed notice.
      operationId: resetPasswordCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 8
      responses:
        "200":
          description: Password reset
        "400":
          description: Invalid, used, or expired link; or password too short
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/customers/change-password:
    post:
      tags: [Customers]
      summary: Change password (authenticated)
      description: Other devices stay signed in.
      operationId: changePasswordCustomer
      security:
        - CustomerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed
        "400":
          description: New password shorter than 8 characters or same as current
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Wrong current password or missing/invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/customers/logout:
    post:
      tags: [Customers]
      summary: Logout (revoke one refresh token)
      description: Revokes that one refresh token (that device/session only).
      operationId: logoutCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Session revoked

  /api/customers/me:
    get:
      tags: [Customers]
      summary: Current customer profile
      operationId: getCustomerMe
      security:
        - CustomerBearer: []
      responses:
        "200":
          description: Customer profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/customers/orders:
    get:
      tags: [Customers]
      summary: Customer's lay-away order history
      description: Customer id comes from the access token.
      operationId: listCustomerOrders
      security:
        - CustomerBearer: []
      responses:
        "200":
          description: Orders with nested installments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomerOrder"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/customers/notifications:
    get:
      tags: [Customers]
      summary: Customer notifications
      description: Newest first. Use `unread` for badge count on My Account.
      operationId: listCustomerNotifications
      security:
        - CustomerBearer: []
      parameters:
        - name: unread
          in: query
          schema:
            type: integer
            enum: [1]
          description: When 1, return unread only
        - name: limit
          in: query
          schema:
            type: integer
            maximum: 200
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/customers/notifications/read:
    post:
      tags: [Customers]
      summary: Mark customer notifications read
      description: "Body `{ ids: [...] }` marks those; empty body marks everything read."
      operationId: markCustomerNotificationsRead
      security:
        - CustomerBearer: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkNotificationsReadRequest"
      responses:
        "200":
          description: Marked read
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/layaway/preview:
    get:
      tags: [Layaway]
      summary: Preview lay-away price and schedules
      description: |
        Public, read-only. Returns marked-up price, down payment, and installment schedules
        before a plan exists — same maths as `POST /api/layaway/plans`, nothing is saved.
        Omit `term_months` to get every allowed term (1 up to admin max) in `options`.
        Due dates assume the plan is created today (15-day steps); real dates lock on create.
      operationId: previewLayaway
      parameters:
        - name: product_id
          in: query
          required: true
          schema:
            type: integer
          description: Gallery item id
        - name: term_months
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: Optional; omit for all allowed terms
      responses:
        "200":
          description: Preview for one or all allowed terms
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LayawayPreviewResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Item has no peso price
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: This item has no peso price yet and cannot be put on lay-away

  /api/layaway/plans:
    post:
      tags: [Layaway]
      summary: Create a lay-away plan
      description: |
        Body `{ product_id, term_months? }`. `term_months` is 1 up to admin-configured max
        (default 3); installments every 15 days (2 per month). Customer id from token.
        Returns 409 if the item has no peso price.
      operationId: createLayawayPlan
      security:
        - CustomerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLayawayPlanRequest"
      responses:
        "200":
          description: Plan created with schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateLayawayPlanResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Item has no peso price
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: This item has no peso price yet and cannot be put on lay-away

  /api/layaway/plans/{id}:
    get:
      tags: [Layaway]
      summary: Lay-away plan detail
      description: |
        Requires a Bearer token (owner customer or staff).
        Includes installments. Pending past due_date flip to `overdue` lazily on read.
        May silently reconstruct after grace period (`is_reconstructed: true`, fixed 6-term schedule).
        Known gap: not yet limited to the plan's owner (to do before go-live).
      operationId: getLayawayPlan
      security:
        - CustomerBearer: []
        - AdminBearer: []
      parameters:
        - $ref: "#/components/parameters/PlanId"
      responses:
        "200":
          description: Plan detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LayawayPlanDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/layaway/plans/{id}/payments:
    post:
      tags: [Layaway]
      summary: Gateway payment (not available)
      description: Gateway path only — blocked pending gateway confirmation.
      operationId: createGatewayPayment
      parameters:
        - $ref: "#/components/parameters/PlanId"
      responses:
        "501":
          description: Not implemented

  /api/layaway/plans/{id}/payments/manual:
    post:
      tags: [Layaway]
      summary: Pay an installment by bank transfer
      description: |
        Installments must be paid in order: 409 `Pay the earlier installment first` if an earlier
        installment is neither paid nor awaiting confirmation (a rejected one must be paid again first).
        `bank_account_id` must be an existing active account (400 `Invalid bank account`,
        409 `Bank account is not active`). 409 `Plan is <status>` when the plan is not active.
      operationId: createManualInstallmentPayment
      security:
        - CustomerBearer: []
      parameters:
        - $ref: "#/components/parameters/PlanId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ManualInstallmentPaymentForm"
      responses:
        "201":
          description: Payment submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualPaymentSubmitted"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: |
            Already awaiting confirmation, reference already used, earlier installment unpaid,
            plan not active (`Plan is <status>`), or bank account not active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/layaway/plans/{id}/down-payment/manual:
    post:
      tags: [Layaway]
      summary: Down payment by bank transfer
      description: |
        Accounting confirms it in the admin queue and the piece is held at that moment
        (or put on backorder if none is in stock). `bank_account_id` must be an existing
        active account (400 `Invalid bank account`, 409 `Bank account is not active`).
      operationId: createManualDownPayment
      security:
        - CustomerBearer: []
      parameters:
        - $ref: "#/components/parameters/PlanId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ManualDownPaymentForm"
      responses:
        "201":
          description: Down payment submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualPaymentSubmitted"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Plan not active, already confirmed/awaiting, reference reused, or bank account not active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/bank-accounts:
    get:
      tags: [Bank Accounts]
      summary: List bank accounts (public)
      description: AlMar Corp bank accounts for the manual payment path.
      operationId: listBankAccounts
      responses:
        "200":
          description: Bank accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BankAccount"
    post:
      tags: [Bank Accounts]
      summary: Create bank account
      description: Admin only. Multipart with optional QR image.
      operationId: createBankAccount
      security:
        - AdminBearer: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [bank_name, account_name, account_number]
              properties:
                bank_name:
                  type: string
                account_name:
                  type: string
                account_number:
                  type: string
                qr_code:
                  type: string
                  format: binary
                  description: QR code image file
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankAccount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/bank-accounts:
    get:
      tags: [Bank Accounts]
      summary: List all bank accounts, including inactive
      description: Roles `admin`, `accounting`. The public `GET /api/bank-accounts` returns active accounts only.
      operationId: listAdminBankAccounts
      security:
        - AdminBearer: []
      responses:
        "200":
          description: Bank accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminBankAccount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Bank Accounts]
      summary: Create bank account
      description: Admin only.
      operationId: createAdminBankAccount
      security:
        - AdminBearer: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [bank_name, account_name, account_number]
              properties:
                bank_name:
                  type: string
                  maxLength: 100
                account_name:
                  type: string
                  maxLength: 100
                account_number:
                  type: string
                  maxLength: 50
                  description: Stays a string
                qr_code:
                  type: string
                  format: binary
                  description: JPEG, PNG or WebP, max 5 MB
                is_active:
                  type: boolean
                  default: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBankAccount"
        "400":
          $ref: "#/components/responses/BankAccountInvalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Duplicate bank_name + account_number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/admin/bank-accounts/{id}:
    patch:
      tags: [Bank Accounts]
      summary: Edit bank account or toggle active
      description: |
        Admin only. Only sent fields change. Omit `qr_code` to keep the image, send
        `remove_qr_code=true` to clear it. No DELETE: deactivate instead.
        Every change is audit-logged with old and new values.
      operationId: updateAdminBankAccount
      security:
        - AdminBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                bank_name:
                  type: string
                  maxLength: 100
                account_name:
                  type: string
                  maxLength: 100
                account_number:
                  type: string
                  maxLength: 50
                qr_code:
                  type: string
                  format: binary
                  description: JPEG, PNG or WebP, max 5 MB
                remove_qr_code:
                  type: boolean
                is_active:
                  type: boolean
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBankAccount"
        "400":
          $ref: "#/components/responses/BankAccountInvalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Duplicate, or deactivating the last active account (`At least one bank account must stay active`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/admin/register:
    post:
      tags: [Admin Auth]
      summary: Bootstrap first admin
      description: Only creates the very first admin; closed afterwards. Use POST /api/admin/staff for further accounts.
      operationId: registerAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminRegisterRequest"
      responses:
        "200":
          description: First admin created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuthResponse"
        "409":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/admin/login:
    post:
      tags: [Admin Auth]
      summary: Admin / staff login
      operationId: loginAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuthResponse"
        "401":
          description: Invalid credentials or deactivated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/admin/refresh:
    post:
      tags: [Admin Auth]
      summary: Refresh admin access token
      operationId: refreshAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/admin/logout:
    post:
      tags: [Admin Auth]
      summary: Admin logout
      operationId: logoutAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Session revoked

  /api/admin/change-password:
    post:
      tags: [Admin Auth]
      summary: Change own staff password
      operationId: changePasswordAdmin
      security:
        - AdminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/admin/me:
    get:
      tags: [Admin Auth]
      summary: Current staff member
      description: Any staff role. Fresh from the database — call after load so a role change shows without re-login.
      operationId: getAdminMe
      security:
        - AdminBearer: []
      responses:
        "200":
          description: Signed-in staff member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMe"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/admin/staff:
    get:
      tags: [Admin Staff]
      summary: List staff
      description: Admin only.
      operationId: listStaff
      security:
        - AdminBearer: []
      responses:
        "200":
          description: Staff list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Admin Staff]
      summary: Create staff account
      description: Admin only. Max 2 active `admin`, max 3 active `accounting`.
      operationId: createStaff
      security:
        - AdminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStaffRequest"
      responses:
        "200":
          description: Staff created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Role cap full or email exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/admin/staff/{id}:
    patch:
      tags: [Admin Staff]
      summary: Update staff
      description: |
        Admin only. Send only fields that change. Cannot change own role or deactivate self;
        last active admin cannot be demoted/deactivated. Caps enforced (`403`/`409`).
        Deactivating, changing the role or resetting the password ends that person's sessions.
      operationId: updateStaff
      security:
        - AdminBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStaffRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Error"

  /api/admin/audit-log:
    get:
      tags: [Admin Staff]
      summary: Audit log
      description: Admin only. Newest first.
      operationId: getAuditLog
      security:
        - AdminBearer: []
      parameters:
        - name: action
          in: query
          schema:
            type: string
        - name: admin_id
          in: query
          schema:
            type: integer
        - name: before_id
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            maximum: 500
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLogEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/plans:
    get:
      tags: [Admin Plans]
      summary: All lay-away plans
      description: |
        Any staff role. Data source for admin orders/dashboard. Closed plans return
        `next_due_date: null` and `overdue_count: 0`. `status` is the raw plan status;
        show overdue by `overdue_count > 0`, not by `status`.
      operationId: listAdminPlans
      security:
        - AdminBearer: []
      responses:
        "200":
          description: Plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminPlan"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/plans/{id}/reservation/retry:
    post:
      tags: [Admin Reservations]
      summary: Retry reservation / hold
      description: Admin only. Re-attempt hold or completion after provider failure.
      operationId: retryReservation
      security:
        - AdminBearer: []
      parameters:
        - $ref: "#/components/parameters/PlanId"
      responses:
        "200":
          description: Retry succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Provider still cannot hold
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationResult"

  /api/admin/plans/{id}/reservation/cancel:
    post:
      tags: [Admin Reservations]
      summary: Cancel reservation / release hold
      description: Admin only. Manual only — never automatic.
      operationId: cancelReservation
      security:
        - AdminBearer: []
      parameters:
        - $ref: "#/components/parameters/PlanId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, handoff_confirmed]
              properties:
                reason:
                  type: string
                handoff_confirmed:
                  type: boolean
                  enum: [true]
                  description: Must be true — termination handed off and agreed with customer
      responses:
        "200":
          description: Reservation cancelled
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/customers:
    get:
      tags: [Admin Customers]
      summary: Customer directory
      description: Any staff role.
      operationId: listAdminCustomers
      security:
        - AdminBearer: []
      responses:
        "200":
          description: Customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminCustomer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/customers/{id}/sessions:
    delete:
      tags: [Admin Customers]
      summary: Revoke all customer sessions
      description: Admin only. Revokes every active refresh token for that customer.
      operationId: revokeCustomerSessions
      security:
        - AdminBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Sessions revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/dashboard:
    get:
      tags: [Admin Dashboard]
      summary: Admin dashboard summary
      description: |
        Any staff role. `collections_last_6_weeks` weeks start on Monday, oldest first, and the
        last point is always the current week.
      operationId: getAdminDashboard
      security:
        - AdminBearer: []
      responses:
        "200":
          description: Dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboard"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/settings:
    get:
      tags: [Admin Settings]
      summary: Business settings
      description: Any staff role. Single row. `penalty_per_day` is `null` until a rate is set — show a dash.
      operationId: getAdminSettings
      security:
        - AdminBearer: []
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [Admin Settings]
      summary: Update business settings
      description: |
        Admin only. Send only changed fields. Rate/grace changes apply to new plans only.
        Also accepts `notify_accounting_roles`.
      operationId: updateAdminSettings
      security:
        - AdminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/markup-rules:
    get:
      tags: [Admin Settings]
      summary: List markup rules
      description: Admin only.
      operationId: listMarkupRules
      security:
        - AdminBearer: []
      responses:
        "200":
          description: Markup rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GenericRule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Admin Settings]
      summary: Create markup rule
      description: 'Admin only. Global rule example `{"percent":30}`.'
      operationId: createMarkupRule
      security:
        - AdminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenericRule"
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericRule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/penalty-rules:
    get:
      tags: [Admin Settings]
      summary: List penalty rules
      description: Admin only.
      operationId: listPenaltyRules
      security:
        - AdminBearer: []
      responses:
        "200":
          description: Penalty rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GenericRule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Admin Settings]
      summary: Create penalty rule
      description: Admin only.
      operationId: createPenaltyRule
      security:
        - AdminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenericRule"
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericRule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/payments/pending:
    get:
      tags: [Admin Payments]
      summary: Pending payment submissions
      description: Any staff role. Oldest first.
      operationId: listPendingPayments
      security:
        - AdminBearer: []
      responses:
        "200":
          description: Pending payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PendingPayment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/payments/due:
    get:
      tags: [Admin Payments]
      summary: Due today and overdue installments
      description: Any staff role. Oldest first.
      operationId: listDuePayments
      security:
        - AdminBearer: []
      responses:
        "200":
          description: Due/overdue list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuePaymentsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/payments/{id}/proof:
    get:
      tags: [Admin Payments]
      summary: View customer proof-of-payment image
      description: Any staff role.
      operationId: getPaymentProof
      security:
        - AdminBearer: []
      parameters:
        - $ref: "#/components/parameters/PaymentId"
      responses:
        "200":
          description: Image
          content:
            image/*:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/admin/payments/{id}/confirmer-proof:
    get:
      tags: [Admin Payments]
      summary: View reviewer confirmer proof
      description: Any staff role. Staff-only; never exposed to customers. 404 if none.
      operationId: getConfirmerProof
      security:
        - AdminBearer: []
      parameters:
        - $ref: "#/components/parameters/PaymentId"
      responses:
        "200":
          description: Image
          content:
            image/*:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/admin/payments/{id}/confirm:
    post:
      tags: [Admin Payments]
      summary: Confirm a payment
      description: |
        Roles `accounting` or `admin`. JSON or multipart. Optional note and confirmer_proof (staff-only).
        Down payment confirmation holds the piece or puts on backorder. The last installment
        completes the plan and the sale. A failed provider step never undoes the payment:
        it comes back as `reservation: { ok: false, error }`.
      operationId: confirmPayment
      security:
        - AdminBearer: []
      parameters:
        - $ref: "#/components/parameters/PaymentId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
          multipart/form-data:
            schema:
              type: object
              properties:
                note:
                  type: string
                confirmer_proof:
                  type: string
                  format: binary
      responses:
        "200":
          description: Confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmPaymentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/payments/{id}/reject:
    post:
      tags: [Admin Payments]
      summary: Reject a payment
      description: Roles `accounting` or `admin`. `reason` required (the customer is notified with it). The term stays unpaid.
      operationId: rejectPayment
      security:
        - AdminBearer: []
      parameters:
        - $ref: "#/components/parameters/PaymentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
          multipart/form-data:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                confirmer_proof:
                  type: string
                  format: binary
      responses:
        "200":
          description: Rejected
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/alerts:
    get:
      tags: [Admin Alerts]
      summary: Badge and dashboard counts
      description: Any staff role. Poll about once a minute while admin is open.
      operationId: getAdminAlerts
      security:
        - AdminBearer: []
      responses:
        "200":
          description: Counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAlerts"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/notifications:
    get:
      tags: [Admin Alerts]
      summary: Staff notifications
      description: Any staff role. Newest first.
      operationId: listAdminNotifications
      security:
        - AdminBearer: []
      parameters:
        - name: unread
          in: query
          schema:
            type: integer
            enum: [1]
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/notifications/read:
    post:
      tags: [Admin Alerts]
      summary: Mark staff notifications read
      operationId: markAdminNotificationsRead
      security:
        - AdminBearer: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkNotificationsReadRequest"
      responses:
        "200":
          description: Marked read
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/notifications/digest:
    post:
      tags: [Admin Alerts]
      summary: Send due-today / overdue digest email now
      description: Admin only. Once per day; subsequent calls same day do nothing.
      operationId: sendAdminDigest
      security:
        - AdminBearer: []
      responses:
        "200":
          description: Digest sent or already sent today
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/jobs/daily:
    post:
      tags: [Admin Alerts]
      summary: Run daily customer notices and digest
      description: |
        Admin only. Overdue, reconstruction, closure, due-today emails and digest.
        Each runs once per day.
      operationId: runDailyJobs
      security:
        - AdminBearer: []
      responses:
        "200":
          description: Jobs run or already run today
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/reservations/sync:
    post:
      tags: [Admin Reservations]
      summary: Sync waiting-for-stock plans
      description: Admin only. Also runs about every 30 minutes while alerts are loaded.
      operationId: syncReservations
      security:
        - AdminBearer: []
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                type: object
                properties:
                  checked:
                    type: integer
                  now_held:
                    type: integer
                  cancelled:
                    type: integer
                  errors:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/reports/receivables:
    get:
      tags: [Admin Reports]
      summary: Overdue and receivables report
      description: |
        Any staff role. Current snapshot (no date filter). `?format=csv` returns the overdue
        items as `receivables-overdue.csv`. Failed requests return JSON `{ error }`, never a file.
      operationId: getReceivablesReport
      security:
        - AdminBearer: []
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [csv]
      responses:
        "200":
          description: Report or CSV
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceivablesReport"
            text/csv:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/reports/profit:
    get:
      tags: [Admin Reports]
      summary: Profit report
      description: |
        Roles `accounting` or `admin`. Interest and markup profit are kept separate. Down payments
        are not tracked as payments yet, so their markup share only appears under `booked_on_new_plans`.
        Gateway fees are not counted as profit. `?format=csv` returns `by_month` rows plus a `total`
        column as `profit-by-month.csv`, honoring `from` and `to`.
      operationId: getProfitReport
      security:
        - AdminBearer: []
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: format
          in: query
          schema:
            type: string
            enum: [csv]
      responses:
        "200":
          description: Profit report or CSV
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfitReport"
            text/csv:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/finance/ledger:
    get:
      tags: [Finance]
      summary: Finance ledger
      description: |
        Any staff role. Returns a bare array (no total; fetch `limit + 1` rows to know if there is
        another page). JSON defaults to 200 rows (max 5000). `format=csv` with no `limit` exports
        every row; with a `limit` it exports that page. File: `ledger.csv`.
      operationId: getFinanceLedger
      security:
        - AdminBearer: []
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: entry_type
          in: query
          schema:
            type: string
            enum: [payment, penalty, receivable]
        - name: plan_id
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            maximum: 5000
            default: 200
        - name: offset
          in: query
          schema:
            type: integer
        - name: format
          in: query
          schema:
            type: string
            enum: [csv]
      responses:
        "200":
          description: Ledger rows or CSV
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LedgerEntry"
            text/csv:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    CustomerBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Customer access_token from register/login/refresh
    AdminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Admin/staff access_token from admin login/refresh (separate from customer)

  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
    GalleryId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    PlanId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    PaymentId:
      name: id
      in: path
      required: true
      schema:
        type: integer

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid access token (or deactivated staff)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BankAccountInvalid:
      description: Invalid bank account
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: Invalid bank account
              fields:
                type: object
                additionalProperties: true
    Forbidden:
      description: Outside caller's role
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Too many attempts — handle distinctly from validation errors
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    AccessTokenResponse:
      type: object
      required: [access_token]
      properties:
        access_token:
          type: string

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 8

    CustomerRegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        phone:
          type: string
          nullable: true
          description: Optional

    Customer:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          description: Member since

    CustomerAuthResponse:
      type: object
      required: [access_token, refresh_token, customer]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        customer:
          $ref: "#/components/schemas/Customer"

    AdminRole:
      type: string
      enum: [admin, accounting]
      description: |
        `admin` — full access (max 2 active).
        `accounting` — view plans, customers, dashboard, settings, payments queue, receivables,
        ledger and profit report; confirm/reject payments (max 3 active).
        Settings changes, rules, bank accounts, staff and audit log are admin-only.

    Admin:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/AdminRole"

    AdminMe:
      allOf:
        - $ref: "#/components/schemas/Admin"
        - type: object
          properties:
            is_active:
              type: boolean

    AdminRegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    AdminAuthResponse:
      type: object
      required: [access_token, refresh_token, admin]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        admin:
          $ref: "#/components/schemas/Admin"

    CreateStaffRequest:
      type: object
      required: [name, email, password, role]
