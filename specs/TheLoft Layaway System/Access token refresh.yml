info:
  name: Access token refresh
  type: http
  seq: 6

http:
  method: POST
  url: https://honeydew-stork-999262.hostingersite.com/api/customers/refresh
  body:
    type: json
    data: |-
      {
        "refresh_token": {{ refresh_token }}
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setEnvVar("refresh_token", res.body.refresh_token)
        bru.setEnvVar("access_token", res.body.access_token)
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.token
        method: jsonq
      variable:
        name: token
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
